[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Parallel for a whole-suite run; tests/conftest.py drops to one process when
# the run names test files. -m integration runs the real-model tests alone.
addopts = -n auto -m "not integration"
markers =
    integration: loads a real model on an accelerator; excluded by default, run with -m integration

# pytest-asyncio warns at startup (once per xdist worker) while this is unset.
# "function" is its future default; the suite has no async fixtures.
asyncio_default_fixture_loop_scope = function

# Filter warnings from dependencies
filterwarnings =
    ignore::FutureWarning
    # torch.utils.mkldnn decorates its class bodies with @torch.jit.script_method,
    # so importing it warns once per method. Reached from diffusers' hooks via
    # torch.fx.experimental.optimization - no dw code calls the deprecated API.
    # The regex covers both spellings: "is deprecated" and, on Python 3.14+,
    # "is not supported".
    ignore:`torch\.jit\.script_method` is:DeprecationWarning
    # transformers' VITS model calls torch.jit.script at import time, reached
    # from diffusers' auto_pipeline via the audioldm2 pipeline whenever a
    # pipeline class is loaded lazily - no dw code calls the deprecated API.
    ignore:`torch\.jit\.script` is:DeprecationWarning
    # diffusers' ConfigMixin.load_config still passes local_dir_use_symlinks to
    # hf_hub_download, which huggingface_hub now ignores and warns about - no
    # dw code passes it.
    ignore:The `local_dir_use_symlinks` argument is deprecated:UserWarning
    # fp4-fp8-for-torch-mps (install.sh adds it on macOS) autoloads with torch
    # and overrides aten::mm and friends on the MPS dispatch key on purpose
    # (docs/DEPENDENCIES.md); torch warns once that a kernel was replaced.
    ignore:Warning only once for all operators:UserWarning
