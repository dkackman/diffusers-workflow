[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusers-workflow"
# The single source of the version: dw.__version__ reads it from here at
# runtime (static in TOML because importing dw at build time would drag
# torch into the build environment). Release tags must match it - see
# docs/RELEASING.md
version = "0.16.0-alpha.1"
description = "Declarative workflow engine and web UI for Hugging Face Diffusers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "dkackman" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The single source of dependencies: the wheel, requirements.txt (a pointer
# to here), install.sh, and CI all resolve this list. Torch ships CPU-only
# from PyPI on Linux - a CUDA build comes from pytorch.org's own index and
# must be installed first (install.sh does; see requirements.txt).
# Version floors track the environment the project is developed and tested
# on (see docs/DEPENDENCIES.md) - refresh them from a working venv rather
# than editing ad hoc:  python scripts/refresh_dep_floors.py
dependencies = [
    # Core ML frameworks
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    # Diffusers and the HuggingFace ecosystem. The floor is the newest
    # PyPI release; the newest pipelines may need git HEAD on top, which
    # install.sh layers on (and the web UI's Models page can install)
    "diffusers>=0.40.0",
    # The floor is past 5.17.0, whose TextToAudioPipeline.preprocess called
    # BatchEncoding.to(dtype=...) and broke every generate_speech call (#169,
    # #232); later releases only cast a BatchFeature, so the exclusion that
    # release needed is gone with it.
    "transformers>=5.19.0",
    "accelerate>=1.15.0",
    "peft>=0.21.2",
    "safetensors>=0.8.0",
    "huggingface-hub>=1.33.0",
    # Loaded at runtime by model tokenizers/text encoders, not imported here
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
    "ftfy>=6.3.1",
    # SDE schedulers
    "torchsde>=0.2.6",
    # Quantization backends (config_objects.py loads them dynamically)
    "torchao>=0.18.0",
    "optimum-quanto>=0.2.7",
    "sdnq>=0.2.8",
    "gguf>=0.19.0",
    "bitsandbytes>=0.50.2; sys_platform == 'linux'",
    # ControlNet preprocessors (brings opencv-headless, scikit-image,
    # scipy, timm) and pipelines that want kornia
    "controlnet-aux>=0.0.10",
    "opencv-python-headless>=5.0.0.93",
    "kornia>=0.8.3",
    # Hub-hosted compiled kernels, fetched at runtime by a model that asks for
    # one - LTX-2.5's diffusion decoder reaches NATTEN's na3d this way, and
    # without it that decoder falls back to a FlexAttention path diffusers' own
    # docstring calls larger than device memory at production grids
    "kernels>=0.17.2",
    # Sol-Attn sparse attention for MiniMax H3's generated-video rows (#931);
    # compiled CUDA/HIP kernels on Linux and Windows, an eager-only wheel elsewhere
    # pre-1.0 kernel API; bump deliberately after a GPU smoke
    "comfy-kitchen>=0.2.38,<0.3",
    # Upscaling and face restoration tasks
    "spandrel>=0.4.2",
    "facexlib>=0.3.0",
    # Imaging and media
    "numpy>=2.5.4",
    "Pillow>=12.3.0",
    "piexif>=1.1.3",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "av>=19.0.1",
    "soundfile>=0.14.0",
    "matplotlib>=3.11.2",
    # BS.1770 integrated loudness / true-peak metering (dw/dsp.py, #361)
    "pyloudnorm>=0.2.0",
    # normalize_audio(limit=true)'s 4x true-peak detection (resample_poly) and
    # look-ahead minimum (minimum_filter1d) - imported directly, so declared
    # rather than left to controlnet-aux (#474)
    "scipy>=1.18.1",
    # speaker_embedding preprocessing arg for generate_speech: reduces a
    # reference clip to the x-vector a SpeechT5 model conditions its voice
    # on (spkrec-xvect-voxceleb). Imported lazily in speech_generation.py,
    # so it's only exercised - and its model only downloaded - by a call
    # that actually passes speaker_embedding.
    "speechbrain>=1.1.1",
    # attribute_voices (dw/tasks/voice_attribution.py, #485): htdemucs
    # separates a song's vocal stem before speechbrain's ECAPA encoder
    # embeds it - on a full mix the accompaniment dominates the embedding
    # and the voices score alike. A hard dependency rather than an extra so
    # the task answers the same on every box; imported lazily, and its
    # weights download only when the task runs with separate=true.
    "demucs>=4.1.0",
    # Utilities
    "qrcode>=8.2",
    "requests>=2.34.2",
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "jsonschema>=4.26.0",
    "concurrent-log-handler>=0.9.30",
    "python-dotenv>=1.2.4",
    "packaging>=26.3",
    # Cross-process lock for claiming a run's directory and version
    # together (dw/runs.py open_run) - already installed transitively
    # through huggingface-hub, declared directly since dw imports it too
    "filelock>=4.1.1",
    # dw.run is a client of dw.serve (dw_mcp/client.py, imported by dw/run.py)
    # rather than an in-process runner, so httpx is a core dependency now,
    # not just the mcp extra's
    "httpx>=0.28.1",
]

[project.optional-dependencies]
server = ["fastapi>=0.143.0", "uvicorn[standard]>=0.54.0"]
mcp = ["mcp>=2.3.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-mock>=3.16.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.17.0",
    "build",
    "mcp>=2.3.0",
    "pylint>=4.1.3",
    "import-linter>=2.15",
    "networkx>=3.7",
    "pygount>=3.2",
]

[project.urls]
Homepage = "https://github.com/dkackman/diffusers-workflow"

[project.scripts]
dw-run = "dw.run:main"
dw-validate = "dw.validate:main"
dw-serve = "dw.serve:main"
dw-test = "dw.test:main"
dw-mcp = "dw_mcp.__main__:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Start conservative: pyflakes + pycodestyle only. Widen (e.g. add "I" for
# import sorting) once the existing codebase is clean under those too.
select = ["E", "F"]
# The formatter already wraps code to the line length; E501 mostly flags
# comments/strings/URLs that can't be split, so it's noise on top of that.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These import a pytest fixture by name and reuse that name as a test
# function's parameter (the idiomatic way to share a fixture across
# modules) - pyflakes/ruff can't tell that from a genuine redefinition.
"tests/test_api_contract.py" = ["F811"]
"tests/test_arguments.py" = ["F811"]
"tests/test_cli.py" = ["F811"]
"tests/test_h3_hold_audio.py" = ["F811"]
"tests/test_jobs_listing.py" = ["F811"]
"tests/test_server_downloads.py" = ["F811"]
"tests/test_server_exports.py" = ["F811"]
"tests/test_server_jobs.py" = ["F811"]
"tests/test_stars.py" = ["F811"]

[tool.setuptools.packages.find]
# tasks/, pipeline_processors/ and community_pipelines/ are namespace
# packages (no __init__.py) - a plain find would silently drop them
include = ["dw*"]
namespaces = true

[tool.setuptools.package-data]
dw = ["*.json", "workflows/*.json", "community_pipelines/*.py", "docs/*.md"]
# docs/ is copied in by scripts/build_dist.sh, the way the SPA is - it is what
# dw.server's list_guides/get_guide serve. A checkout has no copy and reads the
# repo's own docs/ instead
# The built SPA, copied in by scripts/build_dist.sh before packaging
"dw.server" = ["ui/**"]
