<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230b7285%22/><text x=%2250%22 y=%2272%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>dw</text></svg>"
    />
    <title>diffusers-workflow</title>
    <style>
      :root {
        --bg: #f7f7f7;
        --ink: #1c1c1c;
        --muted: #6b6b6b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #131313;
          --ink: #e8e8e8;
          --muted: #9a9a9a;
        }
      }
      :root[data-theme='dark'] {
        --bg: #131313;
        --ink: #e8e8e8;
        --muted: #9a9a9a;
      }
      :root[data-theme='light'] {
        --bg: #f7f7f7;
        --ink: #1c1c1c;
        --muted: #6b6b6b;
      }
      html {
        background: var(--bg);
        color: var(--ink);
      }
      body {
        margin: 0;
      }
      #boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        min-height: 100vh;
        padding: 0 1rem;
        text-align: center;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      #boot .brand {
        font-size: 2rem;
        font-weight: 700;
      }
      #boot .loading,
      #boot .failed {
        color: var(--muted);
      }
      /* no script: a delayed animation swaps the two lines (opacity, height
         and visibility animate everywhere; display does not) */
      #boot .failed {
        visibility: hidden;
        max-height: 0;
        overflow: hidden;
        animation: boot-show 0s 10s forwards;
      }
      #boot .loading {
        animation: boot-hide 0s 10s forwards;
      }
      @keyframes boot-show {
        to {
          visibility: visible;
          max-height: 10rem;
        }
      }
      @keyframes boot-hide {
        to {
          visibility: hidden;
          max-height: 0;
          overflow: hidden;
        }
      }
    </style>
    <script>
      // Apply a manual theme choice before first paint; absent = follow the system
      try {
        var theme = localStorage.getItem('dw-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch (e) {
        /* storage unavailable - system theme applies */
      }
    </script>
  </head>
  <body spellcheck="false" autocapitalize="off" autocorrect="off">
    <div id="app">
      <div id="boot" role="status">
        <span class="brand">dw</span>
        <span class="loading">Loading dw…</span>
        <span class="failed"
          >dw didn't load. Reload the page; if that doesn't help, check that the
          server is running.</span
        >
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
