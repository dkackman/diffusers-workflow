name: CI

on:
  push:
    branches: [master]
    # v + semver only (glob, so the release job re-checks it exactly)
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

# Default for every job; release and pypi declare the extra grants they need
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # The requirements files are pointers into pyproject.toml, where
          # the dependency list actually lives
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt
      # System libs opencv-python needs at import
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      # CPU wheels: an order of magnitude smaller than CUDA, and the suite
      # is mocked - the two tests that run a real generation skip themselves
      # when no accelerator is present
      - name: Install torch (CPU)
        run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        # requirements.txt resolves pyproject.toml's dependencies + server
        # extra; requirements-test.txt the dev extra. diffusers from git
        # goes on afterwards so the resolver doesn't replace it with a
        # release
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          pip install git+https://github.com/huggingface/diffusers
      - name: Format check
        run: black --check dw dw_mcp tests
      - name: Tests
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Format check
        run: npx prettier --check src e2e *.ts *.js
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  wheel:
    # The packaged artifact: SPA built into the wheel. Tags and manual runs
    # only - the jobs above already prove the build on every push.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [backend, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cd ui && npm ci
      - run: pip install build
      - run: bash scripts/build_dist.sh
      - uses: actions/upload-artifact@v7
        with:
          name: diffusers-workflow-dist
          path: dist/*

  desktop-core:
    # The shell's decisions - paths, GPU detection, ports, provisioning,
    # config merging - live in a crate with no Tauri dependency precisely
    # so they can be tested in seconds on every push rather than only at
    # release time. The contract test needs the Python side, so this job
    # installs the package without torch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install the Python side of the contract test
        # dw_mcp imports nothing from dw (test_mcp_server.py::TestStartupWeight
        # guards that), so httpx plus the repo on PYTHONPATH is enough to run
        # its half of the contract for real - no torch in this job. The
        # dw.repl half needs the whole engine and skips here; the backend
        # job's pytest run covers that side's own behaviour.
        run: pip install httpx
      - name: Format check
        run: cd desktop && cargo fmt --all --check
      - name: Clippy
        run: cd desktop && cargo clippy -p dw_desktop_core --all-targets -- -D warnings
      - name: Tests
        run: cd desktop && cargo test -p dw_desktop_core
        env:
          DW_CONTRACT_PYTHON: python
          PYTHONPATH: ${{ github.workspace }}
          # A skipped test still reports ok, so name the half this job is
          # meant to prove: if dw_mcp ever stops being importable here, the
          # job fails instead of going quietly green. dw.repl is not listed -
          # it needs torch and is expected to skip in this job.
          DW_CONTRACT_REQUIRE: dw_mcp.client

  desktop:
    # The installers. Tags and manual runs only - these are slow and large.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [backend, ui, desktop-core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # arm64 - the only macOS target we ship
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04    # older glibc/webkit2gtk = widest AppImage reach
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system dependencies
        # xdg-utils supplies xdg-open, which the AppImage bundler embeds
        # into the bundle: without it `tauri build` fails at packaging
        # time, after an otherwise successful compile
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev xdg-utils
      - name: Fetch the bundled runtime
        # python-build-standalone + uv, verified against pinned checksums
        shell: bash
        run: bash desktop/scripts/fetch-runtime.sh "${{ matrix.target }}"
      - name: Seed content for the bundle
        # The example workflows and prompts are not in the wheel, so the
        # app bundle is the only place they can come from
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources/seed
          cp -r workflows desktop/src-tauri/resources/seed/workflows
          cp -r prompts desktop/src-tauri/resources/seed/prompts
      - run: cd desktop && npm ci
      - name: Build the installer
        run: cd desktop && npm run tauri build -- --target ${{ matrix.target }}
        env:
          # Tauri's own update-signing key. Independent of OS code signing,
          # so the unsigned Windows build still auto-updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS only; the other runners ignore these
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/target/${{ matrix.target }}/release/bundle/**/*.sig

  release:
    # A v<semver> tag that passed the full test and build chain becomes a
    # GitHub release carrying the wheel and sdist
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the declared versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not v<semver>"; exit 1
          fi
          pyproject=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pyproject" ]; then
            echo "Tag $tag != pyproject version $pyproject"
            exit 1
          fi
          # The shell pins the wheel to its own version, so a shell built at
          # a different version would install a wheel that does not exist
          desktop=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -1)
          if [ "$tag" != "$desktop" ]; then
            echo "Tag $tag != desktop shell version $desktop"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: diffusers-workflow-dist
          path: dist
      - name: Collect the desktop installers
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A pre-release marker in the tag (v1.2.3-rc1) marks the release too
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag $prerelease

  pypi:
    # Trusted publishing (OIDC) - register on pypi.org first: project
    # diffusers-workflow, owner dkackman, repo diffusers-workflow,
    # workflow ci.yml, environment pypi. No token or secret is stored.
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/diffusers-workflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: diffusers-workflow-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
